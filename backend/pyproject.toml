[project]
name = "kanji-workshop-api"
version = "0.1.0"
description = "WaniKani-connected backend for Kanji Workshop"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # WaniKani calls are all async and often fanned out, so httpx over requests.
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Lambda adapter. Harmless when running under uvicorn.
    "mangum>=0.19",
]

[project.optional-dependencies]
dev = [
    "uvicorn[standard]>=0.32",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Alembic writes these; `op.create_table(...)` calls are long by construction
# and reformatting every autogenerated revision by hand is pure churn. The
# template they come from (migrations/script.py.mako) is kept in house style.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags function calls in argument defaults. That is precisely how
# FastAPI declares dependencies (`x = Depends(...)`, `q = Query(...)`), so the
# rule is a false positive across every route module.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
